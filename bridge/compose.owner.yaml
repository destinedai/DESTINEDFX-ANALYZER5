services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8000"
      BRIDGE_DB_PATH: /data/bridge.sqlite3
      BRIDGE_BASE_URL: ${BRIDGE_BASE_URL:?Set the exact private HTTPS origin}
      ALLOW_LOOPBACK_HTTP: "false"
      TRUSTED_PROXY_IPS: 172.30.250.2
      CREDENTIALS_FERNET_KEY: ${CREDENTIALS_FERNET_KEY:?Load from the owner host secret store}
      WORKER_TOKEN: ${WORKER_TOKEN:?Load from the owner host secret store}
      NEWS_PROVIDER_URL: ${NEWS_PROVIDER_URL:-}
      NEWS_PROVIDER_TOKEN: ${NEWS_PROVIDER_TOKEN:-}
      NEWS_BLACKOUT_BEFORE_SECONDS: "1800"
      NEWS_BLACKOUT_AFTER_SECONDS: "1800"
      NEWS_MAX_AGE_SECONDS: "120"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    volumes:
      - bridge-data:/data
    networks:
      owner-bridge:
        ipv4_address: 172.30.250.3
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      BRIDGE_HOST: ${BRIDGE_HOST:?Set the exact Tailscale DNS hostname}
    ports:
      - "${TAILSCALE_IPV4:?Bind only to the Windows host's Tailscale IPv4}:443:443"
    volumes:
      - ./Caddyfile.owner:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      owner-bridge:
        ipv4_address: 172.30.250.2
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

networks:
  owner-bridge:
    ipam:
      config:
        - subnet: 172.30.250.0/29

volumes:
  bridge-data:
  caddy-data:
  caddy-config:
