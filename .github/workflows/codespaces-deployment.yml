name: Codespaces deployment diagnostics

on:
  push:
    paths:
      - '.devcontainer/**'
      - 'deploy/codespaces/**'
      - 'scripts/linux-host/**'
      - 'scripts/host/**'
      - 'scripts/test_mt5_diagnostics.py'
      - 'scripts/test_wine_guard.py'
      - 'scripts/test_linux_host.py'
      - 'scripts/test_linux_slot_worker.py'
      - 'bridge/app.py'
      - 'bridge/test_app.py'
      - 'bridge/test_codespaces_controller.py'
      - 'app/src/main/java/com/example/ui/SimplifiedBotWorkstation.kt'
      - 'app/src/main/java/com/example/ui/workstations/BotWorkstation.kt'
      - 'app/src/main/java/com/example/ui/SimplifiedAnalyzerTab.kt'
      - 'app/src/main/java/com/example/data/market/MarketDataRepositoryImpl.kt'
      - 'app/src/main/java/com/example/domain/usecase/impl/SignalGenerationUseCaseImpl.kt'
      - 'app/src/test/java/com/example/MarketDataSafetyTest.kt'
      - 'scripts/destinedfx_readiness_audit.py'
      - 'scripts/test_destinedfx_readiness_audit.py'
      - 'README.md'
      - '.github/workflows/codespaces-deployment.yml'
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'deploy/codespaces/**'
      - 'scripts/linux-host/**'
      - 'scripts/test_mt5_diagnostics.py'
      - 'scripts/test_wine_guard.py'
      - 'scripts/test_linux_host.py'
      - 'scripts/test_linux_slot_worker.py'
      - 'bridge/app.py'
      - 'bridge/test_app.py'
      - 'app/src/main/java/com/example/ui/SimplifiedBotWorkstation.kt'
      - 'app/src/main/java/com/example/ui/workstations/BotWorkstation.kt'
      - 'app/src/main/java/com/example/ui/SimplifiedAnalyzerTab.kt'
      - 'app/src/main/java/com/example/data/market/MarketDataRepositoryImpl.kt'
      - 'app/src/main/java/com/example/domain/usecase/impl/SignalGenerationUseCaseImpl.kt'
      - 'app/src/test/java/com/example/MarketDataSafetyTest.kt'
      - 'scripts/destinedfx_readiness_audit.py'
      - 'scripts/test_destinedfx_readiness_audit.py'
      - 'README.md'
      - '.github/workflows/codespaces-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-codespaces-contract:
    runs-on: ubuntu-24.04
    env:
      CODESPACE_NAME: ''
      DESTINEDFX_APP_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest -r bridge/requirements.txt
      - name: Install Codespaces contract binaries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb x11vnc novnc websockify
      - name: Validate deployment shell syntax
        run: |
          bash -n .devcontainer/postCreate.sh deploy/codespaces/start-demo.sh deploy/codespaces/start.sh \
            deploy/codespaces/stop.sh deploy/codespaces/gui.sh \
            deploy/codespaces/first-run-check.sh scripts/linux-host/install-mt5.sh \
            scripts/linux-host/launch-mt5.sh scripts/linux-host/check-wine-mt5-compat.sh \
            scripts/linux-host/wine-guard.sh scripts/linux-host/wine-probe.sh
      - name: Run DestinedFX source audit and offline Bridge probe tests
        run: |
          python3 -m pytest -q bridge/test_codespaces_controller.py
          python3 scripts/test_destinedfx_readiness_audit.py
          python3 scripts/destinedfx_readiness_audit.py
      - name: Run offline MT5 diagnostic tests
        run: python3 scripts/test_mt5_diagnostics.py
      - name: Run Wine and Linux-host regression tests
        run: pytest -q deploy/codespaces/test_display_processes.py scripts/test_wine_guard.py scripts/test_linux_host.py scripts/test_linux_isolation.py scripts/test_codespaces_two_user_acceptance.py scripts/test_linux_slot_worker.py scripts/host/test_destinedfx_trigger_host.py bridge/test_app.py
      - name: Run offline Codespaces shell contract
        run: bash deploy/codespaces/test-codespaces.sh
