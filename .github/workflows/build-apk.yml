name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "host-v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge test dependencies
        run: python -m pip install -r bridge/requirements.txt
      - name: Check pinned Bridge dependency vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r bridge/requirements.txt
      - name: Run APK artifact-integrity and signing-config tests
        run: python -m pytest -q scripts/test_apk_integrity.py scripts/test_android_signing_config.py scripts/test_apk_metadata_consistency.py
      - name: Run shared MT5 login contract fixtures
        run: python -m pytest -q scripts/test_login_contract.py
      - name: Run offline Deriv DEMO smoke-harness tests
        run: python -m pytest -q scripts/test_deriv_demo_smoke.py
      - name: Run Linux MT5 host runtime and recovery tests
        run: python -m pytest -q scripts/test_linux_host.py scripts/test_linux_isolation.py scripts/test_codespaces_two_user_acceptance.py scripts/test_linux_slot_worker.py scripts/linux-host/test_check_slot_worker.py scripts/linux-host/test_public_endpoints.py scripts/host/test_destinedfx_trigger_host.py scripts/test_linux_worker.py scripts/test_linux_tools.py scripts/test_self_hosted_linux_host.py scripts/test_linux_host_acceptance.py
      - name: Run bridge tests
        run: python -m pytest -q bridge
      - name: Run LIVE activation preflight tests (read-only)
        run: python -m pytest -q scripts/test_live_activation_preflight.py
      - name: Run phone-to-MT5 remote-controller preflight tests (read-only)
        run: python -m pytest -q scripts/test_mt5_remote_controller_preflight.py
      - name: Build and smoke-test the owner Docker bridge image
        run: |
          env BRIDGE_BASE_URL=https://bridge.ci.example.ts.net \
            HOST_GENERATION=ci-compose-validation-only \
            CREDENTIALS_FERNET_KEY=ci-compose-validation-only \
            WORKER_BOOTSTRAP_TOKEN=ci-compose-validation-only \
            MANAGEMENT_STEP_UP_PUBLIC_KEY=ci-compose-validation-only-not-a-real-key \
            TAILSCALE_IPV4=127.0.0.1 BRIDGE_HOST=bridge.ci.example.ts.net \
            docker compose -f bridge/compose.owner.yaml config --quiet
          docker build --file bridge/Dockerfile --tag destinedfx-bridge:ci bridge
          docker run --rm --entrypoint python destinedfx-bridge:ci -c "import app, quantitative; print('Bridge image imports passed')"
          docker run --rm -e BRIDGE_HOST=bridge.ci.example.ts.net \
            -v "$GITHUB_WORKSPACE/bridge/Caddyfile.owner:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
      - name: Run managed-worker tests
        run: |
          python -m pytest -q managed-worker --junitxml=/tmp/managed-worker-junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('/tmp/managed-worker-junit.xml').getroot()
          doctor = [case for case in root.iter('testcase') if 'test_doctor' in case.attrib.get('classname', '') or 'test_doctor' in case.attrib.get('file', '')]
          executed = [case for case in doctor if case.find('skipped') is None]
          if len(executed) < 9:
              raise SystemExit(f'Expected at least 9 executed test_doctor.py cases, found {len(executed)}.')
          print(f'test_doctor.py cases executed: {len(executed)}')
          PY
      - name: Run MT5 EA source-contract and safety-math regressions
        run: python -m pytest -q mt5-ea/test_ea_source.py mt5-ea/test_ea_safety_math.py

  backend-tests:
    name: Application backend tests and PostgreSQL migration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_management"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_management
      ADMIN_EMAILS: ci-admin@example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
      - name: Run backend API and isolated migration tests
        working-directory: backend
        run: python -m pytest -q
      - name: Apply real PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify runtime readiness and authenticated preference persistence on PostgreSQL
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              ready = client.get('/ready')
              assert ready.status_code == 200, ready.text
              assert ready.json() == {'status': 'ready', 'database': 'ok'}
              created = client.post('/api/v1/auth/register', json={'email':'ci-user@example.org','password':'Correct horse battery staple 92!'})
              assert created.status_code == 201, created.text
              token = client.post('/api/v1/auth/login', json={'email':'ci-user@example.org','password':'Correct horse battery staple 92!'}).json()['access_token']
              headers = {'Authorization': f'Bearer {token}'}
              saved = client.put('/api/v1/preferences/theme', json={'value': {'mode':'dark'}}, headers=headers)
              assert saved.status_code == 200, saved.text
              assert client.get('/api/v1/preferences', headers=headers).json()['theme'] == {'mode':'dark'}
          print('PostgreSQL readiness, auth, and preference persistence verified.')
          PY
      - name: Validate backend Compose configuration and build image
        working-directory: backend
        env:
          POSTGRES_DB: app_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app_management
          APP_DOMAIN: api.example.test
          CADDY_EMAIL: ci@example.test
          STEP_UP_PRIVATE_KEY_PEM: ci-compose-validation-only-not-a-real-key
        run: |
          docker compose -f compose.yaml config --quiet
          docker build --tag destinedfx-app-backend:ci .
      - name: Check pinned backend dependency vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r backend/requirements.txt

  secret-scan:
    name: Scan current tree for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan checked-out tree with redacted findings
        run: |
          "$(go env GOPATH)/bin/gitleaks" dir --redact=100 --exit-code 1 .

  broker-validation:
    name: Broker DNS and TCP 443 validation (no account login)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check validator contract and exact four-broker catalog
        run: python -m unittest -v scripts.test_broker_validation_contract
      - name: Run read-only broker DNS and TCP port 443 checks
        run: python scripts/test_broker_validation.py --strict-network
  mt5-ea-windows-compile:
    name: Compile MT5 EA with genuine MetaEditor
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows owner-stack PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'managed-worker/windows/install-owner-stack.ps1',
            'managed-worker/windows/run-owner-stack.ps1',
            'managed-worker/windows/backup-bridge.ps1',
            'managed-worker/windows/protect-backup.ps1',
            'managed-worker/windows/restore-bridge.ps1',
            'managed-worker/launch-worker.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
            Write-Host "PowerShell syntax valid: $file"
          }
      - name: Run owner-stack PowerShell contract tests
        shell: pwsh
        run: Invoke-Pester -Path managed-worker/windows/OwnerStack.Tests.ps1 -Output Detailed -CI
      - name: Install MetaTrader and compile the EA (external vendor download is non-blocking)
        id: metaeditor
        continue-on-error: true
        shell: pwsh
        run: ./scripts/compile-mt5-ea.ps1 -OutputDir "$env:RUNNER_TEMP\destinedfx-ea"
      - name: Upload compiled EA and compiler evidence
        if: steps.metaeditor.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-MT5-EA-ex5
          path: ${{ runner.temp }}/destinedfx-ea/
          if-no-files-found: error

  android-build-and-unit-tests:
    name: Android JVM tests and APK build (bounded)
    needs: python-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # APK assembly and upload are intentionally independent of emulator health.
    # Set this public URL only after the managed bridge is deployed; never put secrets here.
    env:
      MT5_MANAGED_SERVICE_URL: ${{ vars.MT5_MANAGED_SERVICE_URL }}
      MANAGEMENT_API_ORIGIN: ${{ vars.MANAGEMENT_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Gradle and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository
          key: android-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'settings.gradle.kts') }}
          restore-keys: |
            android-${{ runner.os }}-
      - name: Prepare independent Robolectric runtime cache files
        run: mkdir -p "$HOME/.cache/robolectric"
      - name: Cache Robolectric SDK 13 runtime independently
        uses: actions/cache@v4
        with:
          path: ~/.cache/robolectric/android-all-instrumented-13-robolectric-9030017-i7.jar
          key: robolectric-${{ runner.os }}-sdk13-9030017
      - name: Cache Robolectric SDK 14 runtime independently
        uses: actions/cache@v4
        with:
          path: ~/.cache/robolectric/android-all-instrumented-14-robolectric-10818077-i7.jar
          key: robolectric-${{ runner.os }}-sdk14-10818077
      - name: Cache Robolectric SDK 15 runtime independently
        uses: actions/cache@v4
        with:
          path: ~/.cache/robolectric/android-all-instrumented-15-robolectric-13954326-i7.jar
          key: robolectric-${{ runner.os }}-sdk15-13954326
      - name: Cache Robolectric SDK 16 runtime independently
        uses: actions/cache@v4
        with:
          path: ~/.cache/robolectric/android-all-instrumented-16-robolectric-13921718-i7.jar
          key: robolectric-${{ runner.os }}-sdk16-13921718
      - name: Cache pinned Robolectric native runtime 1.0.18
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2/files-2.1/org.robolectric/nativeruntime-dist-compat/1.0.18
          key: ${{ runner.os }}-robolectric-native-runtime-1.0.18
      - name: Fetch Robolectric SDK 13 and 14 in parallel
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/robolectric"
          fetch_runtime() {
            version="$1"
            jar="$cache_dir/android-all-instrumented-$version.jar"
            if [[ -s "$jar" ]] && unzip -tq "$jar" >/dev/null 2>&1; then echo "SDK runtime cache valid: $version"; return 0; fi
            rm -f "$jar"
            artifact_path="org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"
            for base in https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
              temporary="$jar.part"
              echo "Fetching Robolectric runtime $version from $base"
              if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 "$base/$artifact_path" --output "$temporary" && unzip -tq "$temporary" >/dev/null 2>&1; then mv "$temporary" "$jar"; echo "Robolectric runtime ready: $version"; return 0; fi
              rm -f "$temporary"
            done
            echo "::warning::Robolectric runtime prefetch failed for $version; Gradle tests will still run and may resolve it through Maven."
            return 1
          }
          fetch_runtime 13-robolectric-9030017-i7 & pid13=$!
          fetch_runtime 14-robolectric-10818077-i7 & pid14=$!
          status13=0; wait "$pid13" || status13=$?
          status14=0; wait "$pid14" || status14=$?
          echo "Robolectric SDK 13 prefetch status: $status13; SDK 14 prefetch status: $status14"
          echo "ROBOLECTRIC_DEPENDENCY_DIR=$cache_dir" >> "$GITHUB_ENV"
      - name: Fetch Robolectric SDK 15 and 16 in parallel
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          cache_dir="$HOME/.cache/robolectric"
          fetch_runtime() {
            version="$1"
            jar="$cache_dir/android-all-instrumented-$version.jar"
            if [[ -s "$jar" ]] && unzip -tq "$jar" >/dev/null 2>&1; then echo "SDK runtime cache valid: $version"; return 0; fi
            rm -f "$jar"
            artifact_path="org/robolectric/android-all-instrumented/$version/android-all-instrumented-$version.jar"
            for base in https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
              temporary="$jar.part"
              echo "Fetching Robolectric runtime $version from $base"
              if curl --fail --location --silent --show-error --connect-timeout 15 --max-time 90 "$base/$artifact_path" --output "$temporary" && unzip -tq "$temporary" >/dev/null 2>&1; then mv "$temporary" "$jar"; echo "Robolectric runtime ready: $version"; return 0; fi
              rm -f "$temporary"
            done
            echo "::warning::Robolectric runtime prefetch failed for $version; Gradle tests will still run and may resolve it through Maven."
            return 1
          }
          fetch_runtime 15-robolectric-13954326-i7 & pid15=$!
          fetch_runtime 16-robolectric-13921718-i7 & pid16=$!
          status15=0; wait "$pid15" || status15=$?
          status16=0; wait "$pid16" || status16=$?
          echo "Robolectric SDK 15 prefetch status: $status15; SDK 16 prefetch status: $status16"
          echo "ROBOLECTRIC_DEPENDENCY_DIR=$cache_dir" >> "$GITHUB_ENV"
      - name: Prepare stable debug keystore
        env:
          DESTINEDFX_DEBUG_KEYSTORE_B64: ${{ secrets.DESTINEDFX_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$DESTINEDFX_DEBUG_KEYSTORE_B64" ]; then
            if ! printf '%s' "$DESTINEDFX_DEBUG_KEYSTORE_B64" | base64 --decode > debug.keystore 2>/dev/null || [ ! -s debug.keystore ]; then
              echo "::error::DESTINEDFX_DEBUG_KEYSTORE_B64 is not a valid encoded keystore; refusing to generate a replacement."
              exit 1
            fi
            chmod 600 debug.keystore
            if ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "::error::The configured debug keystore does not contain the required androiddebugkey alias with the Android debug store password."
              exit 1
            fi
            echo "Stable protected debug keystore loaded and alias verified." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            echo "::warning title=Fresh-install-only APK::DESTINEDFX_DEBUG_KEYSTORE_B64 is not configured; this job generated a fresh debug certificate. APKs from other jobs or runs may not be upgrade-compatible."
            echo "No stable debug keystore is configured; each independent build job may generate a different debug signer. No upgrade compatibility is claimed." >> "$GITHUB_STEP_SUMMARY"
          fi
          cert_sha256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | awk 'toupper($1) ~ /^SHA-?256:/ {gsub(":", "", $2); print tolower($2); exit}')"
          if ! [[ "$cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to derive the prepared debug certificate fingerprint."
            exit 1
          fi
          echo "DESTINEDFX_DEBUG_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"
          echo "DESTINEDFX_DEBUG_KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"
          echo "Prepared debug certificate SHA-256: $cert_sha256" >> "$GITHUB_STEP_SUMMARY"
          chmod 600 debug.keystore
          mkdir -p "$HOME/.android"
          install -m 600 debug.keystore "$HOME/.android/debug.keystore"
      - name: Create .env from example (public placeholders only)
        run: cp .env.example .env
      - name: Explain runtime management API setup when no origin is embedded
        if: env.MANAGEMENT_API_ORIGIN == ''
        run: |
          echo "::warning title=Management API origin required::Configure MANAGEMENT_API_ORIGIN in the APK build variables or enter and verify it in Settings > Account & Management Service > Management API HTTPS origin."
          echo "Management registration, Bridge identity assertions and LIVE password reauthentication cannot reach the backend until an origin is configured." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate configured management API and EdDSA key (if supplied)
        if: env.MANAGEMENT_API_ORIGIN != ''
        run: |
          python - <<'PY'
          import ipaddress, json, os, urllib.error, urllib.parse, urllib.request
          raw = os.environ["MANAGEMENT_API_ORIGIN"].strip()
          try:
              u = urllib.parse.urlsplit(raw)
              host = (u.hostname or "").lower().rstrip(".")
              port = u.port
          except (ValueError, UnicodeError):
              raise SystemExit("MANAGEMENT_API_ORIGIN has an invalid host or port.")
          placeholder = (
              host in {"example.com", "example.org", "example.net", "localhost", "0.0.0.0", "127.0.0.1", "::1"}
              or "example" in host or host.startswith(("your-", "placeholder"))
              or host.endswith((".example", ".localhost", ".test", ".invalid"))
          )
          try:
              address = ipaddress.ip_address(host.strip("[]"))
              private = not address.is_global
          except ValueError:
              private = ":" in host or all(ch in "0123456789." for ch in host)
          if (u.scheme != "https" or not host or u.username or u.password or u.query or u.fragment
              or u.path not in ("", "/") or port == 0 or (port is not None and not 1 <= port <= 65535)
              or placeholder or private):
              raise SystemExit("MANAGEMENT_API_ORIGIN must be a public HTTPS origin without a path, credentials, query or fragment.")
          def get_json(path):
              req = urllib.request.Request(raw.rstrip("/") + path, headers={"Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=12) as response:
                  if response.status != 200:
                      raise SystemExit("Management API endpoint did not return HTTP 200.")
                  body = response.read(65537)
              if len(body) > 65536:
                  raise SystemExit("Management API endpoint response exceeded the size limit.")
              try:
                  return json.loads(body)
              except Exception:
                  raise SystemExit("Management API endpoint did not return valid JSON.")
          ready = get_json("/ready")
          if ready.get("status") != "ready":
              raise SystemExit("Management API database readiness has not passed.")
          key = get_json("/api/v1/auth/bridge-verification-key")
          if (key.get("algorithm") != "EdDSA"
              or not str(key.get("public_key_pem", "")).startswith("-----BEGIN PUBLIC KEY-----")
              or key.get("issuer") != "destinedfx-management"
              or key.get("audience") != "destinedfx-bridge"):
              raise SystemExit("Management API does not publish the expected EdDSA Bridge verification key.")
          print("Management API HTTPS, database readiness and EdDSA public-key configuration verified (URL and key omitted).")
          PY
      - name: Explain runtime bridge URL setup when no URL is embedded
        if: env.MT5_MANAGED_SERVICE_URL == ''
        run: |
          echo "::warning title=Runtime bridge URL required::Enter the deployed public HTTPS origin in Bot > Remote MT5 EA Bridge > Managed bridge HTTPS URL."
          echo "The APK supports runtime bridge URL setup. This does not deploy or connect the Windows worker." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate configured managed-service URL (if supplied)
        if: env.MT5_MANAGED_SERVICE_URL != ''
        run: |
          python - <<'PY'
          import ipaddress, os
          from urllib.parse import urlparse
          raw = os.environ["MT5_MANAGED_SERVICE_URL"].strip()
          try:
              u = urlparse(raw)
              host = (u.hostname or "").lower().rstrip(".")
              port = u.port
          except (ValueError, UnicodeError):
              raise SystemExit("MT5_MANAGED_SERVICE_URL has an invalid hostname or port.")
          placeholder = (
              host in {"example.com", "example.org", "example.net", "testserver", "bridge.example",
                       "localhost", "0.0.0.0"} or "example" in host or
              host.startswith("your-") or host.startswith("placeholder") or
              host.endswith(".localhost") or host.endswith(".test") or host.endswith(".invalid")
          )
          private = False
          try:
              ip = ipaddress.ip_address(host.strip("[]"))
              private = not ip.is_global
          except ValueError:
              private = ":" in host or all(ch in "0123456789." for ch in host)
          if (u.scheme != "https" or not host or u.username or u.password or u.query or u.fragment
              or u.path not in ("", "/") or port == 0 or port is not None and not (1 <= port <= 65535)
              or placeholder or private):
              raise SystemExit("MT5_MANAGED_SERVICE_URL must be a real public HTTPS origin without a path, credentials, query, or fragment.")
          print("Managed-service URL format accepted; no connection or deployment is implied.")
          PY
      - name: Check managed bridge readiness when configured
        if: env.MT5_MANAGED_SERVICE_URL != ''
        run: |
          set -euo pipefail
          url="${MT5_MANAGED_SERVICE_URL%/}"
          body="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url/health/ready")"
          python - "$body" <<'PY'
          import json, sys
          try:
              body = json.loads(sys.argv[1])
          except Exception as exc:
              raise SystemExit(f"Managed bridge readiness endpoint returned invalid JSON: {exc}")
          if body.get("status") != "ready" or body.get("managed_execution") != "configured":
              raise SystemExit("Managed bridge is reachable but not ready for managed-execution requests.")
          print("Managed bridge /health/ready responded. This does not prove worker, news provider, or broker-terminal readiness.")
          PY
          echo "Managed bridge readiness endpoint responded successfully. This is only a deployment health check; provider, worker, MT5 compile, and DEMO fill acceptance remain separate." >> "$GITHUB_STEP_SUMMARY"
      - name: Run affected Android JVM test classes, then full suite (bounded retries for Maven HTTP 429)
        id: jvm-tests
        timeout-minutes: 35
        shell: bash
        run: |
          set -uo pipefail
          chmod +x gradlew
          repositories=(
            "https://repo.maven.apache.org/maven2"
            "https://maven-central.storage-download.googleapis.com/maven2"
            "https://repo1.maven.org/maven2"
            "https://maven-central.storage-download.googleapis.com/maven2"
          )
          backoff=(30 60 120)
          run_suite() {
            local suite_name="$1"
            shift
            local attempt=1
            local last_log=""
            while [[ "$attempt" -le 4 ]]; do
              local repository="${repositories[$((attempt - 1))]}"
              export ROBOLECTRIC_DEPENDENCY_REPO_URL="$repository"
              local log="$RUNNER_TEMP/android-jvm-${suite_name// /-}-attempt-$attempt.log"
              last_log="$log"
              echo "Android JVM suite '$suite_name', attempt $attempt/4; Maven mirror: $repository"
              set +e
              ./gradlew testDebugUnitTest "$@" --max-workers=2 --stacktrace 2>&1 | tee "$log"
              local status=${PIPESTATUS[0]}
              set -e
              if [[ "$status" -eq 0 ]]; then
                echo "Android JVM suite '$suite_name' passed on attempt $attempt."
                return 0
              fi
              if ! grep -Eqi 'HTTP response code: 429|HTTP[[:space:]]+429|status code:? 429|429 Too Many Requests' "$log"; then
                echo "Android JVM suite '$suite_name' failed for a reason other than Maven HTTP 429; refusing to retry." >&2
                return "$status"
              fi
              if [[ "$attempt" -lt 4 ]]; then
                local delay="${backoff[$((attempt - 1))]}"
                echo "Maven HTTP 429 detected for '$suite_name'; retrying after ${delay}s."
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            echo "JVM acceptance is NOT PASSED: Robolectric dependencies remained HTTP 429 for '$suite_name'." >&2
            tail -n 80 "$last_log" >&2
            return 1
          }

          echo "=== Focused Android broker login regression classes ==="
          if ! run_suite focused-broker-login --tests 'com.example.BrokerLoginSpecTest' --tests 'com.example.ui.bot.MetaTraderBrokerFlowTest'; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "JVM acceptance is NOT PASSED: focused Android broker login tests did not pass." >&2
            exit 1
          fi

          echo "=== Complete Android JVM suite ==="
          if ! run_suite full-jvm; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "JVM acceptance is NOT PASSED: complete Android JVM suite did not pass." >&2
            exit 1
          fi
          echo "status=passed" >> "$GITHUB_OUTPUT"
      - name: Upload Android JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-jvm-test-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
      - name: Verify nonzero Android JVM test execution
        if: steps.jvm-tests.outputs.status != 'rate_limited'
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/test-results/testDebugUnitTest").rglob("TEST-*.xml"))
          executed = failed = 0
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("skipped") is None:
                      executed += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
          if executed == 0:
              raise SystemExit("Android JVM task produced zero executed tests; refusing to report a pass.")
          print(f"Android JVM tests executed: {executed}; failed: {failed}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\nAndroid JVM tests executed: **{executed}**; failed: **{failed}**.\n")
          PY
      - name: Grep release sources for fabricated balances and universal FBS/Deriv servers
        shell: bash
        run: |
          set -euo pipefail
          pattern='fake[ _-]*balance|hardcoded[ _-]*balance|mock[ _-]*balance|FBS-Real.{0,40}(default|server[[:space:]]*=)|Deriv-Demo.{0,40}(default|server[[:space:]]*=)|ServerSuggestion.{0,80}(FBS-Real|Deriv-Demo)'
          set +e
          grep -R -n -i -E "$pattern" -- app/src/main bridge/app.py managed-worker/worker.py mt5-ea
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Release source contains a prohibited mock balance or universal broker server assignment." >&2
            exit 1
          elif [ "$result" -ne 1 ]; then
            exit "$result"
          fi
          echo "0 matches: fake balance, hardcoded balance, mock balance, universal FBS-Real/Deriv-Demo server assignment."
          echo "Release source integrity grep: **0 prohibited matches**." >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify APK source, signer, package, SDKs, ABIs and checksums
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          apksigner="$ANDROID_HOME/build-tools/$tools_dir/apksigner"
          aapt="$ANDROID_HOME/build-tools/$tools_dir/aapt"
          test -x "$apksigner"
          test -x "$aapt"
          python scripts/verify_apk_artifact.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --gradle app/build.gradle.kts \
            --apksigner "$apksigner" \
            --aapt "$aapt" \
            --source-sha "$GITHUB_SHA" \
            --expected-certificate-sha256 "$DESTINEDFX_DEBUG_CERT_SHA256" \
            --output app/build/outputs/apk/debug/verified/apk-metadata.json
          {
            echo "### Debug APK verification"
            echo "The metadata records exact source SHA, package/version, SDKs, ABIs, size, APK SHA-256 and certificate SHA-256."
            cat app/build/outputs/apk/debug/verified/apk-metadata.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified debug APK and metadata
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-DEBUG-APK-FOR-DEMO-TEST-ONLY
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/verified/apk-metadata.json
            app/build/outputs/apk/debug/verified/apk-metadata.json.sha256
          if-no-files-found: error
  codespaces-bootstrap-apk:
    name: Locked Codespaces bootstrap APK
    needs: [python-tests, android-build-and-unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CODESPACES_GITHUB_CLIENT_ID: ${{ vars.CODESPACES_GITHUB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare stable debug keystore
        env:
          DESTINEDFX_DEBUG_KEYSTORE_B64: ${{ secrets.DESTINEDFX_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$DESTINEDFX_DEBUG_KEYSTORE_B64" ]; then
            if ! printf '%s' "$DESTINEDFX_DEBUG_KEYSTORE_B64" | base64 --decode > debug.keystore 2>/dev/null || [ ! -s debug.keystore ]; then
              echo "::error::DESTINEDFX_DEBUG_KEYSTORE_B64 is not a valid encoded keystore; refusing to generate a replacement."
              exit 1
            fi
            chmod 600 debug.keystore
            if ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "::error::The configured debug keystore does not contain the required androiddebugkey alias with the Android debug store password."
              exit 1
            fi
            echo "Stable protected debug keystore loaded and alias verified." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            echo "::warning title=Fresh-install-only APK::DESTINEDFX_DEBUG_KEYSTORE_B64 is not configured; this job generated a fresh debug certificate. APKs from other jobs or runs may not be upgrade-compatible."
            echo "No stable debug keystore is configured; each independent build job may generate a different debug signer. No upgrade compatibility is claimed." >> "$GITHUB_STEP_SUMMARY"
          fi
          cert_sha256="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey 2>/dev/null | awk 'toupper($1) ~ /^SHA-?256:/ {gsub(":", "", $2); print tolower($2); exit}')"
          if ! [[ "$cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to derive the prepared debug certificate fingerprint."
            exit 1
          fi
          echo "DESTINEDFX_DEBUG_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"
          echo "DESTINEDFX_DEBUG_KEYSTORE_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"
          echo "Prepared debug certificate SHA-256: $cert_sha256" >> "$GITHUB_STEP_SUMMARY"
          chmod 600 debug.keystore
          mkdir -p "$HOME/.android"
          install -m 600 debug.keystore "$HOME/.android/debug.keystore"
      - name: Create .env from example (public placeholders only)
        run: cp .env.example .env
      - name: Grep release sources for fabricated balances and universal FBS/Deriv servers
        shell: bash
        run: |
          set -euo pipefail
          pattern='fake[ _-]*balance|hardcoded[ _-]*balance|mock[ _-]*balance|FBS-Real.{0,40}(default|server[[:space:]]*=)|Deriv-Demo.{0,40}(default|server[[:space:]]*=)|ServerSuggestion.{0,80}(FBS-Real|Deriv-Demo)'
          set +e
          grep -R -n -i -E "$pattern" -- app/src/main bridge/app.py managed-worker/worker.py mt5-ea
          result=$?
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Release source contains a prohibited mock balance or universal broker server assignment." >&2
            exit 1
          elif [ "$result" -ne 1 ]; then
            exit "$result"
          fi
          echo "0 matches: fake balance, hardcoded balance, mock balance, universal FBS-Real/Deriv-Demo server assignment."
          echo "Release source integrity grep: **0 prohibited matches**." >> "$GITHUB_STEP_SUMMARY"
      - name: Compile locked Codespaces bootstrap APK without waiting for Robolectric tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PdestinedfxEndpointsLocked=true \
            -PdestinedfxCodespacesHostDiscovery=true \
            -Pmt5ManagedServiceUrl=__CONFIGURATION_REQUIRED__ \
            -PmanagementApiOrigin=__CONFIGURATION_REQUIRED__ \
            -PcodespacesGithubClientId="$CODESPACES_GITHUB_CLIENT_ID" \
            --stacktrace
          set -euxo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          echo "APK_FILE_PRESENT"
          config="$(find app/build/generated/source/buildConfig/debug -type f -name BuildConfig.java -print -quit)"
          test -n "$config"
          grep -Fq 'DESTINEDFX_ENDPOINTS_LOCKED = true' "$config"
          grep -Fq 'DESTINEDFX_CODESPACES_HOST_DISCOVERY = true' "$config"
          grep -Fq 'MT5_MANAGED_SERVICE_URL = "__CONFIGURATION_REQUIRED__"' "$config"
          grep -Fq 'MANAGEMENT_API_ORIGIN = "__CONFIGURATION_REQUIRED__"' "$config"
          grep -Fq "CODESPACES_GITHUB_CLIENT_ID" "$config"
          if [[ -n "$CODESPACES_GITHUB_CLIENT_ID" ]]; then
            grep -Fq "CODESPACES_GITHUB_CLIENT_ID = \"$CODESPACES_GITHUB_CLIENT_ID\"" "$config"
          fi
          echo "BUILD_CONFIG_FLAGS_VERIFIED"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          test -x "$ANDROID_HOME/build-tools/$tools/apksigner"
          test -x "$ANDROID_HOME/build-tools/$tools/aapt2"
          echo "ANDROID_BUILD_TOOLS=$tools"
          "$ANDROID_HOME/build-tools/$tools/apksigner" verify --verbose --print-certs "$apk" > /tmp/codespaces-apk-signature.txt
          grep -Eq 'certificate SHA-256 digest:[[:space:]]*[0-9a-fA-F]{64}' /tmp/codespaces-apk-signature.txt
          echo "APK_SIGNATURE_VERIFIED"
          metadata="$("$ANDROID_HOME/build-tools/$tools/aapt2" dump badging "$apk")"
          grep -Fq "package: name='com.aistudio.destinedfx.qwvzxp'" <<<"$metadata"
          grep -Fq "arm64-v8a" <<<"$metadata"
          grep -Fq "x86_64" <<<"$metadata"
          echo "APK_PACKAGE_AND_ABIS_VERIFIED"
          mkdir -p app/build/outputs/apk/codespaces
          python scripts/verify_apk_artifact.py \
            --apk "$apk" --gradle app/build.gradle.kts \
            --apksigner "$ANDROID_HOME/build-tools/$tools/apksigner" \
            --aapt "$ANDROID_HOME/build-tools/$tools/aapt2" \
            --source-sha "$GITHUB_SHA" \
            --expected-certificate-sha256 "$DESTINEDFX_DEBUG_CERT_SHA256" \
            --output app/build/outputs/apk/codespaces/Codespaces-bootstrap.metadata.json
          cp "$apk" app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk
          sha256sum app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk | tee app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk.sha256
      - name: Upload locked Codespaces bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-DEBUG-APK-FOR-DEMO-TEST-ONLY-Codespaces-bootstrap
          path: |
            app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk
            app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk.sha256
            app/build/outputs/apk/codespaces/Codespaces-bootstrap.metadata.json
            app/build/outputs/apk/codespaces/Codespaces-bootstrap.metadata.json.sha256
          if-no-files-found: error
      - name: Explain optional in-app GitHub Device Flow client ID
        if: vars.CODESPACES_GITHUB_CLIENT_ID == ''
        run: |
          echo "::notice title=GitHub Device Flow client ID::The locked Codespaces bootstrap APK was built with no public Client ID embedded. Enter the existing GitHub App public Client ID in the app's GitHub connection panel before Device Flow sign-in. No App Client Secret is required or embedded."
          echo "The locked Codespaces bootstrap APK is available. Its GitHub App public Client ID is blank in this build; enter the public Client ID in the app's GitHub connection panel before Device Flow sign-in. Do not use a Client Secret." >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble standard debug APK independently of Robolectric tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --max-workers=2 --stacktrace
      - name: Verify standard debug APK signature, identity, metadata, and ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          apksigner="$ANDROID_HOME/build-tools/$tools/apksigner"
          aapt2="$ANDROID_HOME/build-tools/$tools/aapt2"
          test -x "$apksigner"
          test -x "$aapt2"
          signature="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)"
          printf '%s\n' "$signature"
          grep -Eq 'certificate SHA-256 digest:[[:space:]]*[0-9a-fA-F]{64}' <<<"$signature"
          metadata="$("$aapt2" dump badging "$apk")"
          grep -Fq "package: name='com.aistudio.destinedfx.qwvzxp'" <<<"$metadata"
          grep -Fq "arm64-v8a" <<<"$metadata"
          grep -Fq "x86_64" <<<"$metadata"
          config="$(find app/build/generated/source/buildConfig/debug -type f -name BuildConfig.java -print -quit)"
          test -n "$config"
          grep -Fq 'DESTINEDFX_ENDPOINTS_LOCKED = false' "$config"
          grep -Fq 'DESTINEDFX_CODESPACES_HOST_DISCOVERY = false' "$config"
          grep -Fq 'MT5_MANAGED_SERVICE_URL = "__CONFIGURATION_REQUIRED__"' "$config"
          grep -Fq 'MANAGEMENT_API_ORIGIN = "__CONFIGURATION_REQUIRED__"' "$config"
          mkdir -p app/build/outputs/apk/debug/verified
          python scripts/verify_apk_artifact.py \
            --apk "$apk" --gradle app/build.gradle.kts \
            --apksigner "$apksigner" --aapt "$aapt2" \
            --source-sha "$GITHUB_SHA" \
            --expected-certificate-sha256 "$DESTINEDFX_DEBUG_CERT_SHA256" \
            --output app/build/outputs/apk/debug/verified/apk-metadata.json
          sha256sum "$apk" | tee app/build/outputs/apk/debug/verified/app-debug.apk.sha256
          echo "Standard debug APK source SHA, signer, package, SDKs, ABIs and digest verified."
      - name: Upload standard debug APK independently of JVM tests
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-DEBUG-APK-FOR-DEMO-TEST-ONLY-independent
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/verified/app-debug.apk.sha256
            app/build/outputs/apk/debug/verified/apk-metadata.json
            app/build/outputs/apk/debug/verified/apk-metadata.json.sha256
          if-no-files-found: error

  apk-signing-consistency:
    name: Verify APK source and signer consistency
    needs: [android-build-and-unit-tests, codespaces-bootstrap-apk]
    runs-on: ubuntu-24.04
    env:
      STABLE_DEBUG_SIGNING_CONFIGURED: ${{ secrets.DESTINEDFX_DEBUG_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Android JVM APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DestinedFX-DEBUG-APK-FOR-DEMO-TEST-ONLY
          path: incoming/android-jvm
      - name: Download locked Codespaces bootstrap APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DestinedFX-DEBUG-APK-FOR-DEMO-TEST-ONLY-Codespaces-bootstrap
          path: incoming/codespaces-bootstrap
      - name: Download independent standard debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DestinedFX-DEBUG-APK-FOR-DEMO-TEST-ONLY-independent
          path: incoming/independent-standard
      - name: Verify exact source SHA, APK digests, package metadata and signer consistency
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$STABLE_DEBUG_SIGNING_CONFIGURED" == "true" ]]; then
            args+=(--stable-signing-required)
          fi
          python scripts/verify_apk_metadata_consistency.py \
            --source-sha "$GITHUB_SHA" \
            --metadata android-jvm=incoming/android-jvm/verified/apk-metadata.json \
            --apk android-jvm=incoming/android-jvm/app-debug.apk \
            --metadata codespaces-bootstrap=incoming/codespaces-bootstrap/Codespaces-bootstrap.metadata.json \
            --apk codespaces-bootstrap=incoming/codespaces-bootstrap/DestinedFX-Codespaces-bootstrap.apk \
            --metadata independent-standard=incoming/independent-standard/verified/apk-metadata.json \
            --apk independent-standard=incoming/independent-standard/app-debug.apk \
            --output dist/apk-signing-consistency.json \
            "${args[@]}"
          {
            echo "### APK provenance and signing consistency"
            echo "No private signing material is included. A successful metadata check is not an APK upgrade test."
            cat dist/apk-signing-consistency.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload APK provenance and signing consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK-signing-consistency-report
          path: |
            dist/apk-signing-consistency.json
            dist/apk-signing-consistency.json.sha256
          if-no-files-found: warn

  android-emulator-instrumentation:
    name: Android emulator instrumentation (runtime acceptance)
    runs-on: ubuntu-24.04
    needs: [python-tests, android-build-and-unit-tests]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare test configuration
        run: |
          chmod +x gradlew
          cp .env.example .env
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Check whether CI can run the Android emulator
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            ls -l /dev/kvm
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Skipped - needs phone test::This runner has no KVM device. Emulator acceptance was skipped; owner must perform the physical Android phone acceptance."
            {
              echo "### Emulator acceptance: **Skipped - needs phone test**"
              echo "This CI runner has no usable /dev/kvm device. The emulator could not be started."
              echo "Owner action required: install the newly built APK on a physical Android phone and complete the DEMO login, account-balance, quote/chart and reconnect checks."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run Android Python runtime instrumentation on clean API 34 emulator
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash ./scripts/run-android-emulator-tests.sh
      - name: Verify nonzero Android instrumentation test execution
        if: success() && steps.kvm.outputs.available == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          executed = failed = 0
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("skipped") is None:
                      executed += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
          if executed == 0:
              raise SystemExit("Emulator task produced zero executed instrumentation tests; runtime acceptance is incomplete.")
          print(f"Android instrumentation tests executed: {executed}; failed: {failed}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\nAndroid instrumentation tests executed: **{executed}**; failed: **{failed}**. Chaquopy runtime acceptance requires these tests to pass.\n")
          PY
      - name: Upload emulator test reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-emulator-test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/reports/ui-screenshots/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/emulator-diagnostics/**
          if-no-files-found: warn

  package-windows-worker-kit:
    name: Package Windows MT5 worker kit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package Windows MT5 worker kit
        run: |
          kit="dist/DestinedFX-Windows-Worker-Kit"
          mkdir -p "$kit/managed-worker" "$kit/managed-worker/windows" "$kit/bridge" "$kit/mt5-ea"
          cp managed-worker/worker.py managed-worker/worker.example.toml managed-worker/README.md managed-worker/launch-worker.ps1 "$kit/managed-worker/"
          cp -R managed-worker/windows/. "$kit/managed-worker/windows/"
          cp bridge/app.py bridge/quantitative.py bridge/requirements.txt "$kit/bridge/"
          cp mt5-ea/DestinedFXTraderEA.mq5 "$kit/mt5-ea/"
          cat > dist/DestinedFX-Windows-Worker-Kit/START-HERE.txt <<'EOF'
          DestinedFX owner-operated Windows kit
          1. Read managed-worker/windows/OWNER-SETUP.md completely before setup.
          2. Requires the owner's Windows PC to remain powered on, awake, connected, and signed in.
          3. Use an authorized private Tailscale tailnet with Serve only; Android must join that same tailnet.
          4. Run managed-worker/windows/install-owner-stack.ps1 only after reviewing the exact genuine broker install and account-issued server.
          5. The bridge binds only to 127.0.0.1:8000. Never use Funnel, a LAN/public listener, or a public unauthenticated endpoint.
          6. Begin with an authorized DEMO account. Verify account identity, fresh terminal heartbeat, worker READY, fills, SL/TP, history and STOP separately.
          7. No LIVE order is authorized by this kit. A queued job or launched terminal is not terminal readiness.
          8. Preserve ProgramData\DestinedFX, DPAPI secrets, SQLite, account directories and verified backups during recovery.
          Tailscale commercial-use eligibility is the operator's responsibility; do not assume Personal plan rights.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-Windows-Worker-Kit
          path: dist/DestinedFX-Windows-Worker-Kit/
          if-no-files-found: error

  package-host-v1-prerelease:
    name: Package host-v1 prerelease (HOLD — owner acceptance required)
    if: false # Keep disabled until persistent Linux host/two-user acceptance, physical phone pairing and real DEMO lifecycle evidence exist. CI fixtures cannot satisfy owner acceptance.
    needs: [mt5-ea-windows-compile, android-build-and-unit-tests, codespaces-bootstrap-apk, android-emulator-instrumentation, apk-signing-consistency, package-windows-worker-kit, python-tests, backend-tests, secret-scan, broker-validation, iac-validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DestinedFX-MT5-EA-ex5
          path: dist/incoming/ea
      - uses: actions/download-artifact@v4
        with:
          name: DestinedFX-DEBUG-APK-FOR-DEMO-TEST-ONLY
          path: dist/incoming/apk
      - uses: actions/download-artifact@v4
        with:
          name: DestinedFX-Windows-Worker-Kit
          path: dist/incoming/worker-kit
      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/host-v1
          ea="$(find dist/incoming/ea -type f -name 'DestinedFXTraderEA.ex5' -print -quit)"
          apk="$(find dist/incoming/apk -type f -name 'app-debug.apk' -print -quit)"
          test -s "$ea"; test -s "$apk"
          cp "$ea" dist/host-v1/DestinedFXTraderEA.ex5
          cp "$apk" dist/host-v1/DestinedFX-debug.apk
          cp -R dist/incoming/worker-kit dist/host-v1/DestinedFX-Windows-Worker-Kit
          (cd dist/host-v1 && zip -qr DestinedFX-Windows-Worker-Kit.zip DestinedFX-Windows-Worker-Kit && rm -rf DestinedFX-Windows-Worker-Kit)
          (cd dist/host-v1 && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cat > dist/host-v1/RELEASE-NOTES.txt <<'EOF'
          DestinedFX host-v prerelease
          This package is owner-operated and is not evidence of broker connectivity or trading readiness.
          Verify SHA256SUMS.txt before installation. Start with DEMO and follow docs/deployment/GO_LIVE_CHECKLIST.md.
          LIVE remains blocked until the existing ModeArmingPolicy and persistent-host requirements are independently satisfied.
          EOF
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/host-v1/* \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "DestinedFX ${GITHUB_REF_NAME} prerelease" \
            --notes-file dist/host-v1/RELEASE-NOTES.txt

  iac-validate:
    name: Validate Azure for Students IaC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep without Azure credentials
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            generated="$GITHUB_WORKSPACE/deploy/azure-students/azuredeploy.generated.json"
            az bicep build --file deploy/azure-students/main.bicep --outfile "$generated"
            python3 - <<'PY'
            import json
            import sys
            from pathlib import Path

            generated = json.loads(Path('deploy/azure-students/azuredeploy.generated.json').read_text())
            checked_in = json.loads(Path('deploy/azure-students/azuredeploy.json').read_text())
            if generated != checked_in:
                print(
                    'Generated Bicep template is semantically different from '
                    'deploy/azure-students/azuredeploy.json; inspect the '
                    'azure-bicep-compiled-template artifact.',
                    file=sys.stderr,
                )
                sys.exit(1)
            print('Generated Bicep template matches the checked-in ARM template.')
            PY
      - name: Preserve generated ARM template for CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-bicep-compiled-template
          path: |
            deploy/azure-students/azuredeploy.generated.json
            deploy/azure-students/azuredeploy.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Azure validation test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Azure free-tier guard tests
        run: python -m pytest -q deploy/azure-students/test_azure_students.py
