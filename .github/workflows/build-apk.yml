name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge test dependencies
        run: python -m pip install -r bridge/requirements.txt
      - name: Run bridge tests
        run: python -m pytest -q bridge
      - name: Run managed-worker tests
        run: python -m unittest discover -s managed-worker -p 'test_*.py' -v
      - name: Run MT5 EA source-contract checks
        run: python -m pytest -q mt5-ea/test_ea_source.py

  build:
    runs-on: ubuntu-24.04
    # Set this public URL as a GitHub Actions repository variable only after the
    # managed bridge is deployed. It is embedded in the APK; never put secrets here.
    env:
      MT5_MANAGED_SERVICE_URL: ${{ vars.MT5_MANAGED_SERVICE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships the Android SDK; just accept licenses
      # so Gradle can download platform 36 on demand.
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # debug.keystore is gitignored, but the debug signing config needs it.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create .env from example (public placeholders only)
        run: cp .env.example .env

      - name: Validate configured managed-service URL (if supplied)
        if: env.MT5_MANAGED_SERVICE_URL != ''
        run: |
          python - <<'PY'
          import ipaddress, os
          from urllib.parse import urlparse
          raw = os.environ["MT5_MANAGED_SERVICE_URL"].strip()
          try:
              u = urlparse(raw)
              host = (u.hostname or "").lower().rstrip(".")
              port = u.port
          except (ValueError, UnicodeError):
              raise SystemExit("MT5_MANAGED_SERVICE_URL has an invalid hostname or port.")
          placeholder = (
              host in {"example.com", "example.org", "example.net", "testserver", "bridge.example",
                       "localhost", "0.0.0.0"} or "example" in host or
              host.startswith("your-") or host.startswith("placeholder") or
              host.endswith(".localhost") or host.endswith(".test") or host.endswith(".invalid")
          )
          private = False
          try:
              ip = ipaddress.ip_address(host.strip("[]"))
              private = not ip.is_global
          except ValueError:
              private = ":" in host or all(ch in "0123456789." for ch in host)
          if (u.scheme != "https" or not host or u.username or u.password or u.query or u.fragment
              or u.path not in ("", "/") or port == 0 or port is not None and not (1 <= port <= 65535)
              or placeholder or private):
              raise SystemExit("MT5_MANAGED_SERVICE_URL must be a real public HTTPS origin without a path, credentials, query, or fragment.")
          print("Managed-service URL format accepted; no connection or deployment is implied.")
          PY

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
