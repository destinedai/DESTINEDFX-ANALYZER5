name: Read-only Android build

on:
  push:
    branches:
      - free/phone-only-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-read-only:
    name: Validate and build read-only Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local environment from public placeholders
        run: cp .env.example .env

      - name: Verify read-only app boundary
        run: python3 scripts/verify_read_only_build.py

      - name: Run Android JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists and is signed
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          sha256sum "$apk" | tee apk-sha256.txt

      - name: Upload read-only debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-read-only-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-jvm-test-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
