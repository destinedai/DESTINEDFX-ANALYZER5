name: Build APK

on:
  push:
    branches: [ "**" ]
    tags: [ "host-v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge test dependencies
        run: python -m pip install -r bridge/requirements.txt
      - name: Check pinned Bridge dependency vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r bridge/requirements.txt
      - name: Run shared MT5 login contract fixtures
        run: python -m pytest -q scripts/test_login_contract.py
      - name: Run offline Deriv DEMO smoke-harness tests
        run: python -m pytest -q scripts/test_deriv_demo_smoke.py
      - name: Run Linux MT5 host runtime and recovery tests
        run: python -m pytest -q scripts/test_linux_host.py scripts/test_linux_isolation.py scripts/test_codespaces_two_user_acceptance.py scripts/test_linux_slot_worker.py scripts/linux-host/test_check_slot_worker.py scripts/host/test_destinedfx_trigger_host.py scripts/test_linux_worker.py scripts/test_linux_tools.py scripts/test_self_hosted_linux_host.py
      - name: Run bridge tests
        run: python -m pytest -q bridge
      - name: Run LIVE activation preflight tests (read-only)
        run: python -m pytest -q scripts/test_live_activation_preflight.py
      - name: Run phone-to-MT5 remote-controller preflight tests (read-only)
        run: python -m pytest -q scripts/test_mt5_remote_controller_preflight.py
      - name: Build and smoke-test the owner Docker bridge image
        run: |
          env BRIDGE_BASE_URL=https://bridge.ci.example.ts.net \
            HOST_GENERATION=ci-compose-validation-only \
            CREDENTIALS_FERNET_KEY=ci-compose-validation-only \
            WORKER_BOOTSTRAP_TOKEN=ci-compose-validation-only \
            MANAGEMENT_STEP_UP_PUBLIC_KEY=ci-compose-validation-only-not-a-real-key \
            TAILSCALE_IPV4=127.0.0.1 BRIDGE_HOST=bridge.ci.example.ts.net \
            docker compose -f bridge/compose.owner.yaml config --quiet
          docker build --file bridge/Dockerfile --tag destinedfx-bridge:ci bridge
          docker run --rm --entrypoint python destinedfx-bridge:ci -c "import app, quantitative; print('Bridge image imports passed')"
          docker run --rm -e BRIDGE_HOST=bridge.ci.example.ts.net \
            -v "$GITHUB_WORKSPACE/bridge/Caddyfile.owner:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
      - name: Run managed-worker tests
        run: |
          python -m pytest -q managed-worker --junitxml=/tmp/managed-worker-junit.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('/tmp/managed-worker-junit.xml').getroot()
          doctor = [case for case in root.iter('testcase') if 'test_doctor' in case.attrib.get('classname', '') or 'test_doctor' in case.attrib.get('file', '')]
          executed = [case for case in doctor if case.find('skipped') is None]
          if len(executed) < 9:
              raise SystemExit(f'Expected at least 9 executed test_doctor.py cases, found {len(executed)}.')
          print(f'test_doctor.py cases executed: {len(executed)}')
          PY
      - name: Run MT5 EA source-contract and safety-math regressions
        run: python -m pytest -q mt5-ea/test_ea_source.py mt5-ea/test_ea_safety_math.py

  backend-tests:
    name: Application backend tests and PostgreSQL migration
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_management"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/app_management
      ADMIN_EMAILS: ci-admin@example.org
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-test.txt
      - name: Run backend API and isolated migration tests
        working-directory: backend
        run: python -m pytest -q
      - name: Apply real PostgreSQL migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Verify runtime readiness and authenticated preference persistence on PostgreSQL
        working-directory: backend
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as client:
              ready = client.get('/ready')
              assert ready.status_code == 200, ready.text
              assert ready.json() == {'status': 'ready', 'database': 'ok'}
              created = client.post('/api/v1/auth/register', json={'email':'ci-user@example.org','password':'Correct horse battery staple 92!'})
              assert created.status_code == 201, created.text
              token = client.post('/api/v1/auth/login', json={'email':'ci-user@example.org','password':'Correct horse battery staple 92!'}).json()['access_token']
              headers = {'Authorization': f'Bearer {token}'}
              saved = client.put('/api/v1/preferences/theme', json={'value': {'mode':'dark'}}, headers=headers)
              assert saved.status_code == 200, saved.text
              assert client.get('/api/v1/preferences', headers=headers).json()['theme'] == {'mode':'dark'}
          print('PostgreSQL readiness, auth, and preference persistence verified.')
          PY
      - name: Validate backend Compose configuration and build image
        working-directory: backend
        env:
          POSTGRES_DB: app_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/app_management
          APP_DOMAIN: api.example.test
          CADDY_EMAIL: ci@example.test
          STEP_UP_PRIVATE_KEY_PEM: ci-compose-validation-only-not-a-real-key
        run: |
          docker compose -f compose.yaml config --quiet
          docker build --tag destinedfx-app-backend:ci .
      - name: Check pinned backend dependency vulnerabilities
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r backend/requirements.txt

  secret-scan:
    name: Scan current tree for secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3
      - name: Scan checked-out tree with redacted findings
        run: |
          "$(go env GOPATH)/bin/gitleaks" dir --redact=100 --exit-code 1 .

  mt5-ea-windows-compile:
    name: Compile MT5 EA with genuine MetaEditor
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows owner-stack PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            'managed-worker/windows/install-owner-stack.ps1',
            'managed-worker/windows/run-owner-stack.ps1',
            'managed-worker/windows/backup-bridge.ps1',
            'managed-worker/windows/protect-backup.ps1',
            'managed-worker/windows/restore-bridge.ps1',
            'managed-worker/launch-worker.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Error }
            Write-Host "PowerShell syntax valid: $file"
          }
      - name: Run owner-stack PowerShell contract tests
        shell: pwsh
        run: Invoke-Pester -Path managed-worker/windows/OwnerStack.Tests.ps1 -Output Detailed -CI
      - name: Install MetaTrader and compile the EA
        shell: pwsh
        run: ./scripts/compile-mt5-ea.ps1 -OutputDir "$env:RUNNER_TEMP\destinedfx-ea"
      - name: Upload compiled EA and compiler evidence
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-MT5-EA-ex5
          path: ${{ runner.temp }}/destinedfx-ea/
          if-no-files-found: error

  android-build-and-unit-tests:
    name: Android JVM tests and APK build
    runs-on: ubuntu-24.04
    # APK assembly and upload are intentionally independent of emulator health.
    # Set this public URL only after the managed bridge is deployed; never put secrets here.
    env:
      MT5_MANAGED_SERVICE_URL: ${{ vars.MT5_MANAGED_SERVICE_URL }}
      MANAGEMENT_API_ORIGIN: ${{ vars.MANAGEMENT_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare stable debug keystore
        env:
          DESTINEDFX_DEBUG_KEYSTORE_B64: ${{ secrets.DESTINEDFX_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DESTINEDFX_DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DESTINEDFX_DEBUG_KEYSTORE_B64" | base64 --decode > debug.keystore
            chmod 600 debug.keystore
            echo "Stable protected debug keystore loaded; APK updates retain the same signing certificate." >> "$GITHUB_STEP_SUMMARY"
          else
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "::warning title=Fresh-install-only APK::DESTINEDFX_DEBUG_KEYSTORE_B64 is not configured; this build uses a new debug certificate and is not guaranteed to update an earlier APK."
            echo "Fresh debug keystore generated; configure the protected DESTINEDFX_DEBUG_KEYSTORE_B64 secret for upgrade-compatible builds." >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p "$HOME/.android"
          install -m 600 debug.keystore "$HOME/.android/debug.keystore"
      - name: Create .env from example (public placeholders only)
        run: cp .env.example .env
      - name: Explain runtime management API setup when no origin is embedded
        if: env.MANAGEMENT_API_ORIGIN == ''
        run: |
          echo "::warning title=Management API origin required::Configure MANAGEMENT_API_ORIGIN in the APK build variables or enter and verify it in Settings > Account & Management Service > Management API HTTPS origin."
          echo "Management registration, Bridge identity assertions and LIVE password reauthentication cannot reach the backend until an origin is configured." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate configured management API and EdDSA key (if supplied)
        if: env.MANAGEMENT_API_ORIGIN != ''
        run: |
          python - <<'PY'
          import ipaddress, json, os, urllib.error, urllib.parse, urllib.request
          raw = os.environ["MANAGEMENT_API_ORIGIN"].strip()
          try:
              u = urllib.parse.urlsplit(raw)
              host = (u.hostname or "").lower().rstrip(".")
              port = u.port
          except (ValueError, UnicodeError):
              raise SystemExit("MANAGEMENT_API_ORIGIN has an invalid host or port.")
          placeholder = (
              host in {"example.com", "example.org", "example.net", "localhost", "0.0.0.0", "127.0.0.1", "::1"}
              or "example" in host or host.startswith(("your-", "placeholder"))
              or host.endswith((".example", ".localhost", ".test", ".invalid"))
          )
          try:
              address = ipaddress.ip_address(host.strip("[]"))
              private = not address.is_global
          except ValueError:
              private = ":" in host or all(ch in "0123456789." for ch in host)
          if (u.scheme != "https" or not host or u.username or u.password or u.query or u.fragment
              or u.path not in ("", "/") or port == 0 or (port is not None and not 1 <= port <= 65535)
              or placeholder or private):
              raise SystemExit("MANAGEMENT_API_ORIGIN must be a public HTTPS origin without a path, credentials, query or fragment.")
          def get_json(path):
              req = urllib.request.Request(raw.rstrip("/") + path, headers={"Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=12) as response:
                  if response.status != 200:
                      raise SystemExit("Management API endpoint did not return HTTP 200.")
                  body = response.read(65537)
              if len(body) > 65536:
                  raise SystemExit("Management API endpoint response exceeded the size limit.")
              try:
                  return json.loads(body)
              except Exception:
                  raise SystemExit("Management API endpoint did not return valid JSON.")
          ready = get_json("/ready")
          if ready.get("status") != "ready":
              raise SystemExit("Management API database readiness has not passed.")
          key = get_json("/api/v1/auth/bridge-verification-key")
          if (key.get("algorithm") != "EdDSA"
              or not str(key.get("public_key_pem", "")).startswith("-----BEGIN PUBLIC KEY-----")
              or key.get("issuer") != "destinedfx-management"
              or key.get("audience") != "destinedfx-bridge"):
              raise SystemExit("Management API does not publish the expected EdDSA Bridge verification key.")
          print("Management API HTTPS, database readiness and EdDSA public-key configuration verified (URL and key omitted).")
          PY
      - name: Explain runtime bridge URL setup when no URL is embedded
        if: env.MT5_MANAGED_SERVICE_URL == ''
        run: |
          echo "::warning title=Runtime bridge URL required::Enter the deployed public HTTPS origin in Bot > Remote MT5 EA Bridge > Managed bridge HTTPS URL."
          echo "The APK supports runtime bridge URL setup. This does not deploy or connect the Windows worker." >> "$GITHUB_STEP_SUMMARY"
      - name: Validate configured managed-service URL (if supplied)
        if: env.MT5_MANAGED_SERVICE_URL != ''
        run: |
          python - <<'PY'
          import ipaddress, os
          from urllib.parse import urlparse
          raw = os.environ["MT5_MANAGED_SERVICE_URL"].strip()
          try:
              u = urlparse(raw)
              host = (u.hostname or "").lower().rstrip(".")
              port = u.port
          except (ValueError, UnicodeError):
              raise SystemExit("MT5_MANAGED_SERVICE_URL has an invalid hostname or port.")
          placeholder = (
              host in {"example.com", "example.org", "example.net", "testserver", "bridge.example",
                       "localhost", "0.0.0.0"} or "example" in host or
              host.startswith("your-") or host.startswith("placeholder") or
              host.endswith(".localhost") or host.endswith(".test") or host.endswith(".invalid")
          )
          private = False
          try:
              ip = ipaddress.ip_address(host.strip("[]"))
              private = not ip.is_global
          except ValueError:
              private = ":" in host or all(ch in "0123456789." for ch in host)
          if (u.scheme != "https" or not host or u.username or u.password or u.query or u.fragment
              or u.path not in ("", "/") or port == 0 or port is not None and not (1 <= port <= 65535)
              or placeholder or private):
              raise SystemExit("MT5_MANAGED_SERVICE_URL must be a real public HTTPS origin without a path, credentials, query, or fragment.")
          print("Managed-service URL format accepted; no connection or deployment is implied.")
          PY
      - name: Check managed bridge readiness when configured
        if: env.MT5_MANAGED_SERVICE_URL != ''
        run: |
          set -euo pipefail
          url="${MT5_MANAGED_SERVICE_URL%/}"
          body="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url/health/ready")"
          python - "$body" <<'PY'
          import json, sys
          try:
              body = json.loads(sys.argv[1])
          except Exception as exc:
              raise SystemExit(f"Managed bridge readiness endpoint returned invalid JSON: {exc}")
          if body.get("status") != "ready" or body.get("managed_execution") != "configured":
              raise SystemExit("Managed bridge is reachable but not ready for managed-execution requests.")
          print("Managed bridge /health/ready responded. This does not prove worker, news provider, or broker-terminal readiness.")
          PY
          echo "Managed bridge readiness endpoint responded successfully. This is only a deployment health check; provider, worker, MT5 compile, and DEMO fill acceptance remain separate." >> "$GITHUB_STEP_SUMMARY"
      - name: Run Android JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace
      - name: Upload Android JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-jvm-test-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
      - name: Verify nonzero Android JVM test execution
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/test-results/testDebugUnitTest").rglob("TEST-*.xml"))
          executed = failed = 0
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("skipped") is None:
                      executed += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
          if executed == 0:
              raise SystemExit("Android JVM task produced zero executed tests; refusing to report a pass.")
          print(f"Android JVM tests executed: {executed}; failed: {failed}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\nAndroid JVM tests executed: **{executed}**; failed: **{failed}**.\n")
          PY
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify APK signature, identity, metadata, ABI, and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt_path="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$apksigner_path"
          test -n "$aapt_path"
          signature="$({ "$apksigner_path" verify --verbose --print-certs "$apk"; } 2>&1)"
          printf '%s\n' "$signature"
          metadata="$("$aapt_path" dump badging "$apk")"
          python - "$metadata" "$signature" <<'PY'
          import re, sys
          from pathlib import Path
          gradle = Path('app/build.gradle.kts').read_text()
          def configured(pattern, label):
              match = re.search(pattern, gradle)
              if not match:
                  raise SystemExit(f'Could not derive {label} from app/build.gradle.kts')
              return match.group(1)
          package = configured(r'applicationId\s*=\s*"([^"]+)"', 'application ID')
          version_code = configured(r'versionCode\s*=\s*(\d+)', 'version code')
          version_name = configured(r'versionName\s*=\s*"([^"]+)"', 'version name')
          abi_block = re.search(r'abiFilters\s*\+=\s*listOf\(([^)]*)\)', gradle)
          if not abi_block:
              raise SystemExit('Could not derive configured ABI filters from app/build.gradle.kts')
          abis = re.findall(r'"([^"]+)"', abi_block.group(1))
          metadata, signature = sys.argv[1:]
          expected = f"package: name='{package}' versionCode='{version_code}' versionName='{version_name}'"
          if expected not in metadata:
              raise SystemExit(f'APK metadata mismatch; expected {expected!r}')
          native_line = next((line for line in metadata.splitlines() if line.startswith('native-code:')), '')
          actual_abis = re.findall(r"'([^']+)'", native_line)
          if not set(abis).issubset(actual_abis):
              raise SystemExit(f'APK ABI mismatch: configured {abis}, package reports {actual_abis}')
          if not re.search(r'certificate SHA-256 digest:\s*[0-9a-fA-F]{64}', signature):
              raise SystemExit('apksigner output did not contain a signing-certificate SHA-256 fingerprint')
          print(f'APK package/version validated against Gradle: {package} {version_name} ({version_code}); ABIs={abis}')
          PY
          printf '%s\n' "$metadata" | grep -E "sdkVersion:|targetSdkVersion:|native-code:"
          zip_listing="$(unzip -l "$apk")"
          printf '%s\n' "$zip_listing" | grep -E 'lib/(arm64-v8a|x86_64)/.*(python|chaquopy)' || {
            echo "Chaquopy native library listing was not found for configured ABIs." >&2
            exit 1
          }
          sha256sum "$apk" | tee /tmp/apk-sha256.txt
          {
            echo "### Debug APK verification"
            echo 'Package: `com.aistudio.destinedfx.qwvzxp`'
            python - <<'PY'
          import re
          from pathlib import Path
          text=Path('app/build.gradle.kts').read_text()
          code=re.search(r'versionCode\s*=\s*(\d+)',text).group(1)
          name=re.search(r'versionName\s*=\s*"([^"]+)"',text).group(1)
          print(f'Version: `{name}` (code `{code}`)')
          PY
            echo 'Signature verified by apksigner; certificate fingerprint:'
            printf '%s\n' "$signature" | grep -E 'certificate SHA-256 digest:'
            echo 'Configured ABI metadata and Chaquopy Python native payload inspected.'
            echo 'SHA-256:'
            echo '```text'
            cat /tmp/apk-sha256.txt
            echo '```'
            echo 'This is a debug APK, not a production release. Emulator instrumentation is reported by its separate job.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build locked GitHub Codespaces bootstrap APK
        if: vars.CODESPACES_GITHUB_CLIENT_ID != ''
        env:
          MT5_MANAGED_SERVICE_URL: ""
          MANAGEMENT_API_ORIGIN: ""
          CODESPACES_GITHUB_CLIENT_ID: ${{ vars.CODESPACES_GITHUB_CLIENT_ID }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PdestinedfxEndpointsLocked=true \
            -PdestinedfxCodespacesHostDiscovery=true \
            -Pmt5ManagedServiceUrl=__CONFIGURATION_REQUIRED__ \
            -PmanagementApiOrigin=__CONFIGURATION_REQUIRED__ \
            -PcodespacesGithubClientId="$CODESPACES_GITHUB_CLIENT_ID" \
            --stacktrace
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          config="$(find app/build/generated/source/buildConfig/debug -type f -name BuildConfig.java -print -quit)"
          test -n "$config"
          grep -Fq 'DESTINEDFX_ENDPOINTS_LOCKED = true' "$config"
          grep -Fq 'DESTINEDFX_CODESPACES_HOST_DISCOVERY = true' "$config"
          grep -Fq 'MT5_MANAGED_SERVICE_URL = "__CONFIGURATION_REQUIRED__"' "$config"
          grep -Fq 'MANAGEMENT_API_ORIGIN = "__CONFIGURATION_REQUIRED__"' "$config"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          "$ANDROID_HOME/build-tools/$tools/apksigner" verify --verbose --print-certs "$apk" > /tmp/codespaces-apk-signature.txt
          grep -Eq 'certificate SHA-256 digest:[[:space:]]*[0-9a-fA-F]{64}' /tmp/codespaces-apk-signature.txt
          "$ANDROID_HOME/build-tools/$tools/aapt2" dump badging "$apk" | grep -Fq "package: name='com.aistudio.destinedfx.qwvzxp'"
          mkdir -p app/build/outputs/apk/codespaces
          cp "$apk" app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk
          sha256sum app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk | tee app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk.sha256
      - name: Upload locked Codespaces bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-Codespaces-bootstrap-apk
          path: |
            app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk
            app/build/outputs/apk/codespaces/DestinedFX-Codespaces-bootstrap.apk.sha256
          if-no-files-found: error
      - name: Explain missing GitHub Device Flow client ID
        if: vars.CODESPACES_GITHUB_CLIENT_ID == ''
        run: |
          echo "::warning title=Codespaces bootstrap APK not built::Set the public repository Actions variable CODESPACES_GITHUB_CLIENT_ID to the GitHub OAuth App Client ID with Device Flow enabled."
          echo "The regular debug APK was still built. The Codespaces bootstrap APK was skipped because GitHub Device Flow cannot be used without the public Client ID." >> "$GITHUB_STEP_SUMMARY"

  android-emulator-instrumentation:
    name: Android emulator instrumentation (runtime acceptance)
    runs-on: ubuntu-24.04
    needs: android-build-and-unit-tests
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare test configuration
        run: |
          chmod +x gradlew
          cp .env.example .env
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Enable and verify KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ ! -e /dev/kvm ]; then
            echo "KVM device /dev/kvm is unavailable; refusing to start the x86_64 emulator without hardware acceleration." >&2
            exit 1
          fi
          ls -l /dev/kvm
      - name: Run Android Python runtime instrumentation on clean API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash ./scripts/run-android-emulator-tests.sh
      - name: Verify nonzero Android instrumentation test execution
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          files = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          executed = failed = 0
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.find("skipped") is None:
                      executed += 1
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed += 1
          if executed == 0:
              raise SystemExit("Emulator task produced zero executed instrumentation tests; runtime acceptance is incomplete.")
          print(f"Android instrumentation tests executed: {executed}; failed: {failed}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"\nAndroid instrumentation tests executed: **{executed}**; failed: **{failed}**. Chaquopy runtime acceptance requires these tests to pass.\n")
          PY
      - name: Upload emulator test reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-emulator-test-reports
          path: |
            app/build/reports/androidTests/connected/**
            app/build/reports/ui-screenshots/**
            app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/emulator-diagnostics/**
          if-no-files-found: warn

  package-windows-worker-kit:
    name: Package Windows MT5 worker kit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package Windows MT5 worker kit
        run: |
          kit="dist/DestinedFX-Windows-Worker-Kit"
          mkdir -p "$kit/managed-worker" "$kit/managed-worker/windows" "$kit/bridge" "$kit/mt5-ea"
          cp managed-worker/worker.py managed-worker/worker.example.toml managed-worker/README.md managed-worker/launch-worker.ps1 "$kit/managed-worker/"
          cp -R managed-worker/windows/. "$kit/managed-worker/windows/"
          cp bridge/app.py bridge/quantitative.py bridge/requirements.txt "$kit/bridge/"
          cp mt5-ea/DestinedFXTraderEA.mq5 "$kit/mt5-ea/"
          cat > dist/DestinedFX-Windows-Worker-Kit/START-HERE.txt <<'EOF'
          DestinedFX owner-operated Windows kit
          1. Read managed-worker/windows/OWNER-SETUP.md completely before setup.
          2. Requires the owner's Windows PC to remain powered on, awake, connected, and signed in.
          3. Use an authorized private Tailscale tailnet with Serve only; Android must join that same tailnet.
          4. Run managed-worker/windows/install-owner-stack.ps1 only after reviewing the exact genuine broker install and account-issued server.
          5. The bridge binds only to 127.0.0.1:8000. Never use Funnel, a LAN/public listener, or a public unauthenticated endpoint.
          6. Begin with an authorized DEMO account. Verify account identity, fresh terminal heartbeat, worker READY, fills, SL/TP, history and STOP separately.
          7. No LIVE order is authorized by this kit. A queued job or launched terminal is not terminal readiness.
          8. Preserve ProgramData\DestinedFX, DPAPI secrets, SQLite, account directories and verified backups during recovery.
          Tailscale commercial-use eligibility is the operator's responsibility; do not assume Personal plan rights.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: DestinedFX-Windows-Worker-Kit
          path: dist/DestinedFX-Windows-Worker-Kit/
          if-no-files-found: error

  package-host-v1-prerelease:
    name: Package host-v1 prerelease
    if: startsWith(github.ref, 'refs/tags/host-v')
    needs: [mt5-ea-windows-compile, android-build-and-unit-tests, package-windows-worker-kit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DestinedFX-MT5-EA-ex5
          path: dist/incoming/ea
      - uses: actions/download-artifact@v4
        with:
          name: DestinedFX-debug-apk
          path: dist/incoming/apk
      - uses: actions/download-artifact@v4
        with:
          name: DestinedFX-Windows-Worker-Kit
          path: dist/incoming/worker-kit
      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/host-v1
          ea="$(find dist/incoming/ea -type f -name 'DestinedFXTraderEA.ex5' -print -quit)"
          apk="$(find dist/incoming/apk -type f -name 'app-debug.apk' -print -quit)"
          test -s "$ea"; test -s "$apk"
          cp "$ea" dist/host-v1/DestinedFXTraderEA.ex5
          cp "$apk" dist/host-v1/DestinedFX-debug.apk
          cp -R dist/incoming/worker-kit dist/host-v1/DestinedFX-Windows-Worker-Kit
          (cd dist/host-v1 && zip -qr DestinedFX-Windows-Worker-Kit.zip DestinedFX-Windows-Worker-Kit && rm -rf DestinedFX-Windows-Worker-Kit)
          (cd dist/host-v1 && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cat > dist/host-v1/RELEASE-NOTES.txt <<'EOF'
          DestinedFX host-v prerelease
          This package is owner-operated and is not evidence of broker connectivity or trading readiness.
          Verify SHA256SUMS.txt before installation. Start with DEMO and follow docs/deployment/GO_LIVE_CHECKLIST.md.
          LIVE remains blocked until the existing ModeArmingPolicy and persistent-host requirements are independently satisfied.
          EOF
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/host-v1/* \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease \
            --title "DestinedFX ${GITHUB_REF_NAME} prerelease" \
            --notes-file dist/host-v1/RELEASE-NOTES.txt

  iac-validate:
    name: Validate Azure for Students IaC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bicep without Azure credentials
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            generated="$GITHUB_WORKSPACE/deploy/azure-students/azuredeploy.generated.json"
            az bicep build --file deploy/azure-students/main.bicep --outfile "$generated"
            python3 - <<'PY'
            import json
            import sys
            from pathlib import Path

            generated = json.loads(Path('deploy/azure-students/azuredeploy.generated.json').read_text())
            checked_in = json.loads(Path('deploy/azure-students/azuredeploy.json').read_text())
            if generated != checked_in:
                print(
                    'Generated Bicep template is semantically different from '
                    'deploy/azure-students/azuredeploy.json; inspect the '
                    'azure-bicep-compiled-template artifact.',
                    file=sys.stderr,
                )
                sys.exit(1)
            print('Generated Bicep template matches the checked-in ARM template.')
            PY
      - name: Preserve generated ARM template for CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-bicep-compiled-template
          path: |
            deploy/azure-students/azuredeploy.generated.json
            deploy/azure-students/azuredeploy.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Azure validation test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Azure free-tier guard tests
        run: python -m pytest -q deploy/azure-students/test_azure_students.py
