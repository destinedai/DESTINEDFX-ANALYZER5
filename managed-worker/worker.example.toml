# Copy to worker.toml on the dedicated Windows host. Never commit the real file or secrets.
control_plane_url = "https://bridge.example.invalid"
data_root = "D:\\DestinedFX\\accounts"
single_broker_brand = "FBS"
max_terminals = 1
mt5_install = "C:\\Program Files\\FBS MT5"
terminal_exe = "C:\\Program Files\\FBS MT5\\terminal64.exe"
metaeditor_exe = "C:\\Program Files\\FBS MT5\\metaeditor64.exe"
ea_source = "D:\\DestinedFX\\release\\DestinedFXTraderEA.mq5"
compiled_ea = ""
symbol = "EURUSD"
poll_seconds = 5
auth_timeout_seconds = 300
max_restart_retries = 3
restart_backoff_seconds = 30

