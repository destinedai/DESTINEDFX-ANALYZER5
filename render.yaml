services:
  - type: web
    name: destinedfx-managed-bridge
    runtime: docker
    # Free is intentionally non-durable and may sleep. It is not execution-ready;
    # use the operator-owned durable HTTPS bridge described in the docs.
    plan: free
    dockerfilePath: ./bridge/Dockerfile
    dockerContext: ./bridge
    # Free hosting is liveness-only; execution readiness remains /health/ready.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: BRIDGE_DB_PATH
        value: /tmp/bridge.sqlite3
      - key: EXECUTION_STORAGE_DURABLE
        value: "false"
      - key: ALLOW_LOOPBACK_HTTP
        value: "false"
      - key: CREDENTIALS_FERNET_KEY
        generateValue: true
      - key: WORKER_TOKEN
        generateValue: true
      - key: NEWS_PROVIDER_URL
        value: https://showmytrades.com/api/public/calendar/v1
      - key: NEWS_BLACKOUT_BEFORE_SECONDS
        value: "1800"
      - key: NEWS_BLACKOUT_AFTER_SECONDS
        value: "1800"
      - key: NEWS_MAX_AGE_SECONDS
        value: "120"
